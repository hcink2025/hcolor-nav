<style>
/* ============================================================ */
/* WebDesk 级 App 桌面图标效果（紧凑网格 + 原生桌面间距） */
/* ============================================================ */

/* 1. 桌面级网格：紧凑自适应排布，完美对齐 WebDesk 图标间隙 */
#sitesGrid {
  display: grid !important;
  grid-template-columns: repeat(auto-fill, 86px) !important; /* 每格固定 86px 桌面单元格 */
  justify-content: center !important;                        /* 居中排列 */
  column-gap: 26px !important;                               /* 横向间距（精确匹配 WebDesk） */
  row-gap: 30px !important;                                  /* 纵向间距 */
  padding: 10px 0 !important;
}

/* 2. 卡片外框完全透明与紧凑贴合 */
#sitesGrid .site-card,
#sitesGrid .site-card.style-3 {
  background: transparent !important;
  background-color: transparent !important;
  border: none !important;
  box-shadow: none !important;
  overflow: visible !important;
  padding: 0 !important;
  width: 86px !important;
  min-height: auto !important;
  height: auto !important;
}

/* 3. 居中排列 */
#sitesGrid .site-card .site-card-content,
#sitesGrid .site-card .site-card-content > a,
#sitesGrid .site-card .site-card-content > a > div,
#sitesGrid .site-card.style-3 .flex.items-start {
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  justify-content: center !important;
  text-align: center !important;
  width: 100% !important;
  position: static !important;
}

/* 4. 统一标准 60x60 App 图标底座（WebDesk Squircle 圆角） */
#sitesGrid .site-card .site-icon,
#sitesGrid .site-card.style-3 .site-icon {
  position: static !important;
  width: 60px !important;               /* 标准 App 图标尺寸 */
  height: 60px !important;
  border-radius: 15px !important;        /* 仿 iOS/WebDesk 平滑大圆角比例 */
  background-color: #ffffff !important;  /* 统一白底基座 */
  overflow: hidden !important;           /* 裁切直角图片为圆角 */
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  margin: 0 auto 6px auto !important;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16) !important; /* 图标悬浮阴影 */
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease !important;
}

/* 5. 图标图片满铺与抗锯齿 */
#sitesGrid .site-card .site-icon img,
#sitesGrid .site-card .site-icon div,
#sitesGrid .site-card.style-3 .site-icon img,
#sitesGrid .site-card.style-3 .site-icon div {
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  border-radius: inherit !important;
  image-rendering: -webkit-optimize-contrast !important;
  image-rendering: high-quality !important;
}

/* 鼠标悬停微动画 */
#sitesGrid .site-card:hover .site-icon {
  transform: translateY(-4px) scale(1.06) !important;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.24) !important;
}

/* 6. 标题文字：贴近图标、单行截断带光影 */
#sitesGrid .site-card .site-title,
#sitesGrid .site-card.style-3 .site-title {
  position: static !important;
  width: 100% !important;
  text-align: center !important;
  margin-top: 2px !important;
  font-size: 12px !important;            /* WebDesk 标准文字字号 12px */
  font-weight: 500 !important;
  line-height: 1.3 !important;
  white-space: nowrap !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
  color: #ffffff !important;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7) !important;
}
 /* 7. 搜索选项文字效果：对齐下方分类导航的颜色与下划线效果 */
.search-engine-option {
  color: rgba(255, 255, 255, 0.94) !important;
  font-size: 0.875rem !important;
  font-weight: 400 !important;
  opacity: 0.85 !important;
  transition: all 0.25s ease !important;
}

.search-engine-option:hover {
  color: #ffffff !important;
  opacity: 1 !important;
}

.search-engine-option.active {
  color: #399dff !important;
  font-weight: 500 !important;
  opacity: 1 !important;
}

.search-engine-option::after {
  height: 2px !important;
  border-radius: 1px !important;
}

.search-engine-option.active::after {
  background: #399dff !important;
  width: 58% !important;
}

.search-engine-option:hover::after {
  background: rgba(57, 157, 255, 0.65) !important;
  width: 42% !important;
} 
 /* 8. 极简通透毛玻璃搜索框：黄金长度 + 绝对上下居中 + 全主题适配 */
html body .home-search-shell,
html.dark body .home-search-shell,
body.desktop-page-style3 .home-search-shell {
  width: 90% !important;
  max-width: 420px !important;                                    /* 核心：黄金比例宽度，与下方分类导航完美呼应 */
  margin-left: auto !important;
  margin-right: auto !important;
  margin-top: 10px !important;
  margin-bottom: 22px !important;                                 /* 与下方分类保持适度舒适的间距 */
}

/* 核心：拉开与上方“站内/Google/Baidu”的距离，实现上下等距居中 */
html body .search-engine-wrapper,
html.dark body .search-engine-wrapper {
  margin-bottom: 16px !important;
  gap: 0.5rem 0.75rem !important;
}

/* 搜索框本体：38px 高度、清透玻璃质感、纯白文字 */
html body .search-input-target,
html.dark body .search-input-target,
html body.desktop-page-style3 .search-input-target,
html.dark body.desktop-page-style3 .search-input-target,
html body.desktop-page-style3.custom-wallpaper .search-input-target,
html.dark body.desktop-page-style3.custom-wallpaper .search-input-target {
  font-size: 13px !important;
  height: 38px !important;
  line-height: normal !important;
  padding-top: 0 !important;
  padding-bottom: 0 !important;
  padding-left: 16px !important;
  padding-right: 38px !important;
  border-radius: 19px !important;
  background: rgba(255, 255, 255, 0.08) !important;
  backdrop-filter: blur(20px) !important;
  -webkit-backdrop-filter: blur(20px) !important;
  border: 1px solid rgba(255, 255, 255, 0.18) !important;
  color: #ffffff !important;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12) !important;
  transition: all 0.25s ease !important;
  box-sizing: border-box !important;
}

/* 提示词颜色与绝对垂直居中 */
html body .search-input-target::placeholder,
html.dark body .search-input-target::placeholder,
html body.desktop-page-style3 .search-input-target::placeholder,
html.dark body.desktop-page-style3 .search-input-target::placeholder {
  color: rgba(255, 255, 255, 0.65) !important;
  font-size: 13px !important;
  font-weight: 400 !important;
  line-height: 36px !important;
}

/* 聚焦状态光晕 */
html body .search-input-target:focus,
html.dark body .search-input-target:focus,
html body.desktop-page-style3 .search-input-target:focus,
html.dark body.desktop-page-style3 .search-input-target:focus {
  background: rgba(255, 255, 255, 0.16) !important;
  border-color: rgba(57, 157, 255, 0.65) !important;
  box-shadow: 0 0 0 3px rgba(57, 157, 255, 0.18), 0 6px 20px rgba(0, 0, 0, 0.2) !important;
}

/* 右侧放大镜图标垂直居中 */
html body .home-search-icon,
html.dark body .home-search-icon,
html body.desktop-page-style3 .home-search-icon,
html.dark body.desktop-page-style3 .home-search-icon {
  top: 50% !important;
  transform: translateY(-50%) !important;
  right: 12px !important;
  left: auto !important;
  width: 16px !important;
  height: 16px !important;
  color: rgba(255, 255, 255, 0.75) !important;
}

html body .search-input-target:focus + .home-search-icon,
html body .home-search-field:focus-within .home-search-icon {
  color: #399dff !important;
}
</style>
</head>
